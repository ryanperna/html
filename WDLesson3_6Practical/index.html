<div class="solutions">
  <div class="container">
    <div class="card">
      <h4>Enter Grades</h4>

      <div>
        <input type="number" id="grade1" placeholder="Grade 1">
      </div>

      <div>
        <input type="number" id="grade2" placeholder="Grade 2">
      </div>

      <div>
        <input type="number" id="grade3" placeholder="Grade 3">
      </div>

      <input type="button" value="Calculate Average" onclick="calculateAverage()">

      <p id="averageResult"></p>
    </div>
  </div>
</div>

<div class="solutions">
  <div class="container">
    <div class="card">
      <h4>Enter Two Points</h4>

      <div>
        <input type="number" id="x1" placeholder="x₁">
      </div>

      <div>
        <input type="number" id="y1" placeholder="y₁">
      </div>

      <div>
        <input type="number" id="x2" placeholder="x₂">
      </div>

      <div>
        <input type="number" id="y2" placeholder="y₂">
      </div>

      <input type="button" value="Calculate Slope" onclick="calculateSlope()">

      <p id="slopeResult"></p>
    </div>
  </div>
</div>

<div class="solutions last">
  <div class="container">
    <div class="card">
      <h4>Enter Height and Weight</h4>

      <div>
        <input type="number" id="height" placeholder="Height (m)">
      </div>

      <div>
        <input type="number" id="weight" placeholder="Weight (kg)">
      </div>

      <input type="button" value="Calculate BMI" onclick="calculateBMI()">

      <p id="bmiResult"></p>
    </div>
  </div>
</div>
