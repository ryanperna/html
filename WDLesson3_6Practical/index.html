<div class="solutions">
  <div class="container">
    <div class="card">
      <h4>Enter Grades</h4>
      <input type="number" id="grade1" placeholder="Grade 1"><br><br>
      <input type="number" id="grade2" placeholder="Grade 2"><br><br>
      <input type="number" id="grade3" placeholder="Grade 3"><br><br>
      <button onclick="calculateAverage()">Calculate Average</button>
      <p id="averageResult"></p>
    </div>
  </div>
</div>

<div class="solutions">
  <div class="container">
    <div class="card">
      <h4>Enter Two Points</h4>
      <input type="number" id="x1" placeholder="x₁"><br><br>
      <input type="number" id="y1" placeholder="y₁"><br><br>
      <input type="number" id="x2" placeholder="x₂"><br><br>
      <input type="number" id="y2" placeholder="y₂"><br><br>
      <button onclick="calculateSlope()">Calculate Slope</button>
      <p id="slopeResult"></p>
    </div>
  </div>
</div>

<div class="solutions last">
  <div class="container">
    <div class="card">
      <h4>Enter Height and Weight</h4>
      <input type="number" id="height" placeholder="Height (m)"><br><br>
      <input type="number" id="weight" placeholder="Weight (kg)"><br><br>
      <button onclick="calculateBMI()">Calculate BMI</button>
      <p id="bmiResult"></p>
    </div>
  </div>
</div>
