<!DOCTYPE html>
<!-- WD Lesson 3.1: 
     How can we add interactions to a web page? -->

<!-- Resources 
     https://www.w3schools.com/js/default.asp
-->
<html>
  <head>
    <title>WD Lesson 3.1 Practical</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <style>


    </style>
  </head>     
  <body>
    <script src="script.js"></script>
      <div class="container center">
       <h1>Event</h1>
       </div>

    <!-- Challenge 1: Give the <div> below a class of "container" -->
      <div class="container"></div>
    <div>
      <!-- Challenge 2: Add three images of your choice. -->
       <img src="china-flag.jpg" onclick="alert('This is the flag of China.')" />
       <img src="great-wall.jpeg" onclick="alert('This is the Great Wall of China.')" />
       <img src="dragon.jpeg" onclick="alert('This is a traditional Chinese dragon.')" />
    </div>

      

       <!-- Challenges 4 - 7 are in style.css-->
    </div>
    <hr>
    <div class="translations">

      <span class="button" onclick="alert('你好 means Hello in English.')">你好</span>
      <span class="button" onclick="alert('谢谢 means Thank you in English.')">谢谢</span>
      <span class="button" onclick="alert('朋友 means Friend in English.')">朋友</span>
    </div>
  </body>
</html>
