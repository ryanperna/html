<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Hotspot Provider Charts</title>

    <link href="style.css" rel="stylesheet" type="text/css"/>
    <link href="c3.css" rel="stylesheet" type="text/css"/>

    <script src="d3.js"></script>
    <script src="c3.js"></script>

    <script src="helper.js"></script>
    <script src="script.js"></script>
</head>

<body onload="init()">

    <!-- Banner -->
    <div id="banner" class="container center">
        <h1>NYC Hotspot Dashboard</h1>
        <p class="subtitle">Search, filter, and visualize hotspot provider data.</p>
    </div>

    <!-- Subbanner -->
    <div class="container subbanner center">
        <p>Use the tools below to explore hotspot locations across NYC.</p>
    </div>

    <!-- Main Layout -->
    <div class="container two-col">

        <!-- LEFT SIDE -->
        <div class="left-side">

            

            <!-- Chart Type -->
            <div class="card">
                <h3>Select Chart Type</h3>
                <select id="chartType">
                    <option value="bar">Bar</option>
                    <option value="pie">Pie</option>
                </select>
                <a class="button" onclick="ByProvider()">Show Chart</a>
            </div>

            <!-- Output Cards -->
            <div class="card">
                <h1>Output</h1>
                <div id="output"></div>
            </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="right-side">
            <div class="card">
                <h1>Chart</h1>
                <div id="chart"></div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <div id="footer" class="container center">
        <h3>NYC Hotspot Dashboard</h3>
    </div>

</body>
</html>
